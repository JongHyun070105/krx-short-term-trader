[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krx-short-term-trader"
version = "0.1.0"
description = "Fail-closed KRX intraday research and shadow-trading toolkit"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pyarrow>=25.0.1",
    "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
krx-trader = "krx_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
